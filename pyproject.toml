[project]
name = "sense-si"
version = "0.0.0"
description = "Python instruments for seeing and hearing. Jev answers questions over their records."
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["packages/decisions/tests", "packages/ears/tests"]
pythonpath = ["packages/decisions/src", "packages/ears/src"]

[tool.coverage.run]
branch = true
source = ["ai_ears", "decisions"]

[tool.coverage.report]
precision = 2
show_missing = true
