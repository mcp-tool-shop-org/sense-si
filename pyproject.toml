[project]
name = "ai-eyes-mcp"
version = "1.1.0"
description = "Grounded visual evaluator MCP server — honest image judgment via SigLIP2"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "vision", "siglip2", "image-evaluation", "grounded-vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
authors = [
    { name = "mcp-tool-shop", email = "64996768+mcp-tool-shop@users.noreply.github.com" },
]
dependencies = [
    "fastmcp>=3.0",
    "torch>=2.1",
    "transformers>=4.45",
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build", "hatchling"]

[project.scripts]
ai-eyes-mcp = "ai_eyes_mcp.server:main"

[project.urls]
Repository = "https://github.com/mcp-tool-shop-org/ai-eyes-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_eyes_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "dogfood: requires SigLIP2 model and GPU (not CI-safe)",
]
