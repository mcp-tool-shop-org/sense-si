[project]
name = "sense-si"
version = "0.0.0"
description = "Python instruments for seeing and hearing. A pinned local engine answers questions over their records."
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["packages/decisions/tests", "packages/ears/tests", "packages/eyes/tests"]
pythonpath = [
    "packages/decisions/src",
    "packages/ears/src",
    "packages/eyes/src",
    # Eyes tests import `tests.conftest` with the package root on the path.
    "packages/eyes",
]
markers = [
    "dogfood: requires the SigLIP2 weights and a GPU, and is not part of CI",
    "kev: live Kev-4B checkpoint, not part of CI",
]

[tool.coverage.run]
branch = true
source = ["ai_ears", "decisions", "ai_eyes_mcp"]

[tool.coverage.report]
precision = 2
show_missing = true
