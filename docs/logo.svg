<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 88" role="img" aria-label="ai-eyes">
  <style>
    .ink   { stroke: #1b2733; }
    .word  { fill: #1b2733; font: 700 44px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -1px; }
    .acc   { stroke: #2f7d6b; }
    .accf  { fill: #2f7d6b; }
    @media (prefers-color-scheme: dark) {
      .ink  { stroke: #e6edf3; }
      .word { fill: #e6edf3; }
      .acc  { stroke: #4bbfa3; }
      .accf { fill: #4bbfa3; }
    }
  </style>
  <!-- eye almond -->
  <path class="ink" fill="none" stroke-width="4" stroke-linecap="round"
        d="M8 44 C 26 18, 62 18, 80 44 C 62 70, 26 70, 8 44 Z"/>
  <!-- iris -->
  <circle class="ink" fill="none" stroke-width="4" cx="44" cy="44" r="17"/>
  <!-- the gaze IS the SigLIP sigmoid: grounded measurement, not narration -->
  <path class="acc" fill="none" stroke-width="4" stroke-linecap="round"
        d="M29 55 C 40 55, 40 33, 59 33"/>
  <!-- pupil -->
  <circle class="accf" cx="44" cy="44" r="4.5"/>
  <text class="word" x="100" y="60">ai-eyes</text>
</svg>
