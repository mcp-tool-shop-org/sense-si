name: CI

# pull_request has no paths filter because it is the required check: a
# docs-only pull request still runs it. push is limited to main, and to the
# paths that change the suite, the root config, or this workflow, so a
# feature branch runs once, through the pull request.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tools/**'
      - 'pyproject.toml'
      - 'codecov.yml'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The upload below is the only step that asks for a token, and it runs
    # on 3.12 only. Job permissions apply to every matrix leg.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: |
          python -m pip install pytest pytest-cov
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install fastmcp 'transformers>=4.45' 'pillow>=10' 'numpy>=1.24'

      - name: pytest
        run: |
          python -m pytest -m "not dogfood" --cov=ai_ears --cov=decisions --cov=ai_eyes_mcp --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=90
          python tools/coverage_bar.py coverage.xml 90

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage.xml
          disable_search: true

  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check
