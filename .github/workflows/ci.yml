name: CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Single Python version — private repo shipping to Anthropic, matrix not needed.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      # Cache the SigLIP2 weights so CI stops re-downloading ~1.6 GB every run.
      - name: Cache SigLIP2 model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-google-siglip2-so400m-patch14-384

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Dependency scan (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit

      - name: Verify imports and tool registration
        run: |
          echo "[1/3] Import check..."
          python -c "from ai_eyes_mcp.server import mcp; from ai_eyes_mcp.engine import SigLIPEngine; print('  imports OK')"
          echo "[2/3] Tool registration check..."
          python -c "
          from ai_eyes_mcp.server import mcp
          import asyncio
          tools = asyncio.run(mcp._list_tools())
          expected = {'image_contains', 'image_classify', 'image_compare', 'image_score_batch', 'image_verify', 'eyes_selftest', 'eyes_status'}
          names = {t.name for t in tools}
          assert names == expected, f'Expected {expected}, got {names}'
          print(f'  {len(tools)} tools registered OK')
          "
          echo "[3/3] Engine status check..."
          python -c "
          from ai_eyes_mcp.engine import SigLIPEngine
          e = SigLIPEngine()
          s = e.status()
          assert s['model_id'], 'model_id missing'
          assert s['device'], 'device missing'
          print(f'  engine OK: model={s[\"model_id\"]}, device={s[\"device\"]}')
          "

      # CI runs test_edge_cases.py — it downloads SigLIP2 (~1.6 GB, cached above)
      # and runs REAL inference on CPU. The fuller dogfood suites
      # (test_engine_dogfood, test_tools_dogfood) run locally on GPU and are left
      # out of CI to keep it fast — NOT because the model is unavailable here.
      - name: Run edge-case tests
        run: pytest tests/test_edge_cases.py -v
